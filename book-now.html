    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Enquiry</title>
</head>
<body>
    <div class="book-div">
    <h1 class="book-head">BOOKING ENQUIRY</h1>
<br><br>
    <form action="#" method="post">

        <label for="name">* Your Name (Required)</label><br>
        <input class="book-name" type="text" id="name" name="name" required>
        <br><br>

        <label for="email">* Your Email (Required)</label><br>
        <input class="book-email" type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">* Your Contact Number (Required)</label><br>
        <input class="book-num" type="tel" id="phone" name="phone" required>
        <br><br>

        <h4>* Select Date :-</h4><input class="date1 book-date" type="date" id="bookingDate"> <k>To</k> <input class="date1 book-date" type="date" id="bookingDate"><br><br>

        <label for="message">* Your Message</label><br>
        <textarea class="book-msg" id="message" name="message"></textarea>
        <br><br>

        <button class="book-btn" type="submit">SEND YOUR BOOKING</button>

    </form>
</div>
</body>
</html>

</body>
