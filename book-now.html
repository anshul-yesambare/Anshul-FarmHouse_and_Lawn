    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Enquiry</title>
</head>
<body>
    <div class="book-div">
    <h1 class="book-head">BOOKING ENQUIRY</h1>
<br><br>
    <form action="#" method="post">
        <label for="name" class="b-page-field">* Your Name (Required)</label><br>
        <input class="book-name book-size" type="text" id="name" name="name" required>
        <br><br>

        <label for="email" class="b-page-field">* Your Email (Required)</label><br>
        <input class="book-email book-size book-size-1" type="email" id="email" name="email" required>
        <br><br>

        <label for="phone" class="b-page-field">* Your Contact Number (Required)</label><br>
        <input class="book-num book-size " type="tel" id="phone" name="phone" required>
        <br><br>

        <h4 class="b-page-field">* Select Date :-</h4><input class="date1 book-date date-ss" type="date" id="bookingDate"> <k>To</k> <input class="date1 book-date date-ss1 " type="date" id="bookingDate"><br><br>

        <label for="message" class="b-page-field">* Your Message</label><br>
        <textarea class="book-msg book-size1" id="message" name="message"></textarea>
        <br><br>

        <button class="book-btn b-page-b-btn" type="submit">SEND YOUR BOOKING</button>

    </form>
</div>
</body>
</html>

</body>
